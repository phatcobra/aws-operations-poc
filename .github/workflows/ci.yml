name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test read-only public experience
        run: node --test tests/site.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (boto3 for the handler under test, cfn-lint for template linting)
        run: pip install --quiet -r requirements-dev.txt cfn-lint

      - name: Run unit tests (deterministic, no network)
        run: python3 -m unittest discover -s tests -v

      - name: Render CloudFormation template (inlines src/app.py, enforces 4096-char limit)
        run: python3 scripts/render_template.py

      - name: Lint rendered CloudFormation template
        run: cfn-lint infra/template.rendered.yaml

      - name: Parse-check one-time PowerShell admin bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/bootstrap_admin.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell bootstrap syntax OK"
