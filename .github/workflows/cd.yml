name: CD

# Deploys aws-operations-poc-main to AWS on every push to main.
#
# AWS bootstrap dependency:
#   1. A GitHub OIDC identity provider must exist in the AWS account
#      (token.actions.githubusercontent.com).
#   2. The deployment role below must trust this repo's immutable GitHub OIDC
#      subject for the production environment exactly:
#        repo:phatcobra@69565195/aws-operations-poc@1372530555:environment:production
#      (NOT the older name-based/branch-ref form -- see docs/AWS_BOUNDARY.md).
#   3. The production environment must be restricted to main.
#
# The role ARN is intentionally explicit here. An IAM role ARN is an identifier,
# not a credential or secret, so keeping it in the workflow avoids an unnecessary
# secret dependency while credentials are still obtained only through OIDC.
# No long-lived AWS access keys are used or requested.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (boto3 for the handler under test, cfn-lint for template linting)
        run: pip install --quiet -r requirements-dev.txt cfn-lint
      - name: Run unit tests (deterministic, no network)
        run: python3 -m unittest discover -s tests -v
      - name: Render and validate CloudFormation template
        run: |
          python3 scripts/render_template.py
          cfn-lint infra/template.rendered.yaml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (boto3 -- scripts/deploy.sh re-runs the test suite as a fail-closed gate)
        run: pip install --quiet -r requirements-dev.txt

      - name: Configure AWS credentials via OIDC (no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::660838763909:role/aws-operations-poc-github-deploy-role
          aws-region: us-east-2

      - name: Deploy aws-operations-poc-main via the CloudFormation service role
        run: bash scripts/deploy.sh
